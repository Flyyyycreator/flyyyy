<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1430">
<title>FLYYYY 1.3</title>

<style>
:root{
    --bg:#0d1430;
    --panel:#121a3d;
    --text:#fff;
    --muted:#b9c5ef;
    --yellow:#ffd447;
    --blue:#5ee7ff;
    --green:#6df5a3;
    --red:#ff6475;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:white;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
    outline:none;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#10162f;
}

/* FIX: Canvas hat jetzt die richtige Sichtbarkeit und Position */
#gameCanvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    touch-action:none;
}

/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(13, 20, 48, 0.85); /* Halbtransparenter Hintergrund über dem Spiel */
}

.screen.active{
    display:flex;
}

.menu{
    width:min(1000px,94vw);
    max-height:92vh;
    overflow:auto;
    padding:35px;
    text-align:center;

    background:
        linear-gradient(
            180deg,
            rgba(15,23,55,.97),
            rgba(18,28,67,.97)
        );

    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* =========================
   TEXT
========================= */

.title{
    text-align:center;
    line-height:.9;
    font-size:clamp(55px,10vw,110px);
    font-weight:1000;
    letter-spacing:.08em;
    color:var(--text);
    text-shadow:
        0 8px 0 rgba(0,0,0,.15),
        0 0 35px rgba(94,231,255,.3);
}

.version{
    width:max-content;
    margin:14px auto;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(94,231,255,.12);
    color:var(--blue);
    font-weight:bold;
    font-size:14px;
}

.score-display{
    font-size:24px;
    color:var(--yellow);
    margin:20px 0;
}

/* =========================
   BUTTONS
========================= */

.btn {
    display:inline-block;
    padding:16px 40px;
    font-size:20px;
    font-weight:bold;
    color:var(--bg);
    background:var(--yellow);
    border-radius:50px;
    box-shadow:0 6px 0 #ccaa39, 0 10px 20px rgba(0,0,0,0.4);
    transition:transform 0.1s, box-shadow 0.1s;
    text-transform:uppercase;
    margin-top:20px;
}

.btn:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 #ccaa39, 0 5px 10px rgba(0,0,0,0.4);
}

/* =========================
   UI HUD
========================= */

#hud {
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    font-size:28px;
    font-weight:bold;
    color:var(--text);
    display:none;
    pointer-events:none;
    text-shadow:2px 2px 4px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div id="app">
    <!-- UI HUD während des Spiels -->
    <div id="hud">SCORE: <span id="hudScore">0</span></div>

    <!-- Canvas für das Gameplay -->
    <canvas id="gameCanvas"></canvas>

    <!-- Startbildschirm -->
    <div id="startScreen" class="screen active">
        <div class="menu">
            <div class="title">FLYYYY</div>
            <div class="version">v1.3</div>
            <button class="btn" onclick="startGame()">Starten</button>
        </div>
    </div>

    <!-- Game Over Bildschirm -->
    <div id="gameOverScreen" class="screen">
        <div class="menu">
            <div class="title" style="color:var(--red);">GAME OVER</div>
            <div class="score-display">Deine Punktzahl: <span id="finalScore">0</span></div>
            <button class="btn" onclick="startGame()">Nochmal</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScore = document.getElementById('finalScore');

// Spielvariablen
let gameActive = false;
let score = 0;
let player = {};
let obstacles = [];
let animationId;
let gameSpeed = 4;
let spawnTimer = 0;

// Canvas-Größe anpassen
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Wenn das Spiel läuft, direkt neu zeichnen, um Flackern zu verhindern
    if(gameActive) drawEverything();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Steuerung (Klick / Touch / Leertaste)
function playerJump(e) {
    if (!gameActive) return;
    if (e) e.preventDefault(); // Verhindert Zoom auf Handys beim Tippen
    player.velocity = player.jumpStrength;
}

window.addEventListener('keydown', (e) => { 
    if (e.code === 'Space') {
        playerJump();
    }
});
// Event-Listener auf das gesamte Fenster/App für besseres Gameplay
window.addEventListener('pointerdown', (e) => {
    // Verhindert das Springen, wenn man auf den Start-Button klickt
    if (!e.target.classList.contains('btn')) {
        playerJump(e);
    }
});

// Spiel starten
function startGame() {
    // Screens wechseln
    startScreen.classList.remove('active');
    gameOverScreen.classList.remove('active');
    hud.style.display = 'block';

    // Variablen zurücksetzen
    gameActive = true;
    score = 0;
    gameSpeed = 4;
    spawnTimer = 80; // Erstes Hindernis spawnt schneller
    hudScore.innerText = score;
    obstacles = [];

    // Spieler-Initialisierung (Gelber Ball)
    player = {
        x: canvas.width * 0.25,
        y: canvas.height / 2,
        radius: 18,
        gravity: 0.4,
        velocity: 0,
        jumpStrength: -8.5
    };

    // Loop starten
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

// Spiel beenden
function gameOver() {
    gameActive = false;
    hud.style.display = 'none';
    finalScore.innerText = score;
    gameOverScreen.classList.add('active');
}

// Hindernis erstellen
function spawnObstacle() {
    const gap = 170; // Lücke zwischen den Röhren
    const minHeight = 60;
    const maxHeight = canvas.height - gap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    obstacles.push({
        x: canvas.width,
        width: 70,
        topHeight: topHeight,
        bottomY: topHeight + gap,
        passed: false
    });
}

// Hilfsfunktion zum Zeichnen
function drawEverything() {
    // Hintergrundfarbe im Canvas zeichnen
    ctx.fillStyle = '#0d1430'; // var(--bg)
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Röhren zeichnen
    for (let obs of obstacles) {
        ctx.fillStyle = '#6df5a3'; // var(--green)
        // Obere Röhre
        ctx.fillRect(obs.x, 0, obs.width, obs.topHeight);
        // Untere Röhre
        ctx.fillRect(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY);
    }

    // Spieler zeichnen
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd447'; // var(--yellow)
    ctx.fill();
    ctx.closePath();
}

// Hauptschleife
function gameLoop() {
    if (!gameActive) return;

    // 1. SPIELER UPDATE
    player.velocity += player.gravity;
    player.y += player.velocity;

    // Decken- und Bodenkollision
    if (player.y + player.radius > canvas.height || player.y - player.radius < 0) {
        gameOver();
        return;
    }

    // 2. HINDERNISSE UPDATE
    spawnTimer++;
    if (spawnTimer > 110) {
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // Kollisionsprüfung (AABB vs Kreis)
        let playerLeft = player.x - player.radius;
        let playerRight = player.x + player.radius;
        let playerTop = player.y - player.radius;
        let playerBottom = player.y + player.radius;

        if (playerRight > obs.x && playerLeft < obs.x + obs.width) {
            if (playerTop < obs.topHeight || playerBottom > obs.bottomY) {
                gameOver();
                return;
            }
        }

        // Punktzahl erhöhen
        if (!obs.passed && obs.x + obs.width < player.x) {
            score++;
            obs.passed = true;
            hudScore.innerText = score;
            gameSpeed += 0.15; // Wird mit jedem Hindernis schneller
        }

        // Aus dem Bildschirm gelaufene Objekte entfernen
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }

    // Alles auf das Canvas rendern
    drawEverything();

    animationId = requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
