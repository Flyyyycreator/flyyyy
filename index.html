<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1430">
<title>FLYYYY 1.3</title>

<style>
:root{
    --bg:#0d1430;
    --panel:#121a3d;
    --text:#fff;
    --muted:#b9c5ef;
    --yellow:#ffd447;
    --blue:#5ee7ff;
    --green:#6df5a3;
    --red:#ff6475;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:white;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
}

/* Das Spielfeld liegt sauber im Hintergrund */
#gameCanvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
}

/* =========================
   SCREENS & OVERLAYS
========================= */

.screen{
    position:absolute;
    inset:0;
    z-index:10;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(13, 20, 48, 0.85);
    pointer-events:auto;
}

.screen.active{
    display:flex;
}

.menu{
    width:min(450px,90vw);
    padding:40px 30px;
    text-align:center;
    background:linear-gradient(180deg, #0f1737, #121c43);
    border:2px solid rgba(255,255,255,0.1);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* =========================
   TEXT / UI ELEMENTS
========================= */

.title{
    font-size:65px;
    font-weight:900;
    letter-spacing:.08em;
    color:var(--text);
    text-shadow:0 0 35px rgba(94,231,255,0.4);
    line-height:1;
    margin-bottom:5px;
}

.version{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(94,231,255,0.15);
    color:var(--blue);
    font-weight:bold;
    font-size:14px;
    margin-bottom:25px;
}

.score-display{
    font-size:26px;
    color:var(--yellow);
    margin:20px 0;
    font-weight:bold;
}

.btn {
    display:inline-block;
    padding:16px 45px;
    font-size:22px;
    font-weight:bold;
    color:#0d1430;
    background:var(--yellow);
    border:none;
    border-radius:50px;
    box-shadow:0 6px 0 #ccaa39;
    cursor:pointer;
    text-transform:uppercase;
    transition:transform 0.05s;
}

.btn:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 #ccaa39;
}

#hud {
    position:absolute;
    top:25px;
    left:25px;
    z-index:5;
    font-size:32px;
    font-weight:900;
    color:var(--text);
    display:none;
    pointer-events:none;
    text-shadow:2px 2px 4px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div id="app">
    <!-- HUD Punkteanzeige während des Spiels -->
    <div id="hud">SCORE: <span id="hudScore">0</span></div>

    <!-- Gameplay Render-Fläche -->
    <canvas id="gameCanvas"></canvas>

    <!-- Startbildschirm -->
    <div id="startScreen" class="screen active">
        <div class="menu">
            <div class="title">FLYYYY</div>
            <div class="version">v1.3</div>
            <button class="btn" onclick="startGame(event)">Starten</button>
        </div>
    </div>

    <!-- Game Over Bildschirm -->
    <div id="gameOverScreen" class="screen">
        <div class="menu">
            <div class="title" style="color:var(--red);">GAME OVER</div>
            <div class="score-display">PUNKTE: <span id="finalScore">0</span></div>
            <button class="btn" onclick="startGame(event)">Nochmal</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScore = document.getElementById('finalScore');

// Globale Spiel-Variablen
let gameActive = false;
let score = 0;
let player = {};
let obstacles = [];
let animationId = null;
let gameSpeed = 4;
let spawnTimer = 0;

// Ausfallsichere Canvas-Größenanpassung
function resizeCanvas() {
    canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
    
    // Falls das Spiel im Hintergrund pausiert ist, zeichnen wir den Start-Zustand vorab
    if (!gameActive && obstacles.length === 0) {
        initPlayerFallback();
        drawEverything();
    }
}

// Hilfsfunktion für die initiale Vorschau-Positionierung des Spielers
function initPlayerFallback() {
    player = {
        x: canvas.width * 0.25,
        y: canvas.height / 2,
        radius: 18,
        gravity: 0.4,
        velocity: 0,
        jumpStrength: -8.5
    };
}

window.addEventListener('resize', resizeCanvas);

// Flug-Steuerung (Sprung auslösen)
function playerJump() {
    if (!gameActive) return;
    player.velocity = player.jumpStrength;
}

// Tastatur-Steuerung (Leertaste)
window.addEventListener('keydown', (e) => { 
    if (e.code === 'Space') {
        e.preventDefault();
        playerJump();
    }
});

// Touch- und Klick-Steuerung für den gesamten Bildschirm
window.addEventListener('pointerdown', (e) => {
    // Verhindert das Springen, wenn ein Menü-Button geklickt wird
    if (e.target.classList.contains('btn')) return;
    playerJump();
});

// Spiel initialisieren und starten
function startGame(e) {
    if (e) {
        e.stopPropagation();
        e.preventDefault();
    }

    // Canvas-Größe vorm Start exakt synchronisieren
    resizeCanvas();

    // UI-Wechsel
    startScreen.classList.remove('active');
    gameOverScreen.classList.remove('active');
    hud.style.display = 'block';

    // Zustand zurücksetzen
    gameActive = true;
    score = 0;
    gameSpeed = 4.5;
    spawnTimer = 100; // Erstes Hindernis erscheint sofort
    hudScore.innerText = score;
    obstacles = [];

    // Spieler-Setup
    initPlayerFallback();

    // Eventuell laufenden Loop stoppen und neu starten
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

// Spiel beenden
function gameOver() {
    gameActive = false;
    if (animationId) cancelAnimationFrame(animationId);
    
    hud.style.display = 'none';
    finalScore.innerText = score;
    gameOverScreen.classList.add('active');
}

// Neue Röhren generieren
function spawnObstacle() {
    const gap = 180; // Größe der Lücke zum Durchfliegen
    const minHeight = 60;
    const maxHeight = canvas.height - gap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    obstacles.push({
        x: canvas.width,
        width: 75,
        topHeight: topHeight,
        bottomY: topHeight + gap,
        passed: false
    });
}

// Zeichen-Routine für alle Objekte
function drawEverything() {
    // 1. Hintergrund leeren & färben
    ctx.fillStyle = '#0d1430'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Hindernisse zeichnen (Grüne Röhren)
    ctx.fillStyle = '#6df5a3'; 
    for (let obs of obstacles) {
        // Obere Röhre
        ctx.fillRect(obs.x, 0, obs.width, obs.topHeight);
        // Untere Röhre
        ctx.fillRect(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY);
    }

    // 3. Spieler zeichnen (Gelber Kreis)
    if (player && player.x) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd447'; 
        ctx.fill();
        ctx.closePath();
    }
}

// Haupt-Game-Loop (Herzschlag des Spiels)
function gameLoop() {
    if (!gameActive) return;

    // 1. PHYSIK & POSITION DES SPIELERS UPDATE
    player.velocity += player.gravity;
    player.y += player.velocity;

    // Kollision mit Decke oder Boden
    if (player.y + player.radius > canvas.height || player.y - player.radius < 0) {
        gameOver();
        return;
    }

    // 2. HINDERNISSE GENERIEREN & BEWEGEN
    spawnTimer++;
    if (spawnTimer > 110) { // Timing-Abstand zwischen Röhren
        spawnObstacle();
        spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // Präzise Kollisionsprüfung (AABB vs Kreis)
        let closestX = Math.max(obs.x, Math.min(player.x, obs.x + obs.width));
        
        // Obere Röhre Kollision
        let closestYTop = Math.max(0, Math.min(player.y, obs.topHeight));
        let distanceXTop = player.x - closestX;
        let distanceYTop = player.y - closestYTop;
        let distanceSquaredTop = (distanceXTop * distanceXTop) + (distanceYTop * distanceYTop);

        // Untere Röhre Kollision
        let closestYBottom = Math.max(obs.bottomY, Math.min(player.y, canvas.height));
        let distanceXBottom = player.x - closestX;
        let distanceYBottom = player.y - closestYBottom;
        let distanceSquaredBottom = (distanceXBottom * distanceXBottom) + (distanceYBottom * distanceYBottom);

        // Wenn der Radius die Box schneidet -> Game Over
        if (distanceSquaredTop < player.radius * player.radius || distanceSquaredBottom < player.radius * player.radius) {
            gameOver();
            return;
        }

        // Punkte zählen, wenn die Röhre erfolgreich passiert wurde
        if (!obs.passed && obs.x + obs.width < player.x) {
            score++;
            obs.passed = true;
            hudScore.innerText = score;
            gameSpeed += 0.15; // Spiel wird kontinuierlich etwas schneller
        }

        // Röhre aus dem Speicher löschen, wenn sie links aus dem Bild läuft
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }

    // 3. ALLES RENDERN
    drawEverything();

    // Nächsten Frame anfordern
