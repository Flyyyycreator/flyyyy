<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyyyy</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    transform: scale(1.03);
}

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.screen.active {
    display: flex;
}

#menu {
    background: linear-gradient(#38bdf8, #2563eb);
}

.logo {
    font-size: 65px;
    font-weight: 900;
    margin-bottom: 20px;
    text-shadow: 0 5px 10px #0007;
}

.stats {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    z-index: 20;
}

.mainBtn {
    background: #22c55e;
    color: white;
    min-width: 190px;
}

.secondaryBtn {
    background: white;
    color: #111827;
    min-width: 190px;
}

#game {
    background: linear-gradient(#38bdf8 0%, #7dd3fc 70%, #65a30d 70%);
}

#gameCanvas {
    width: 100%;
    height: 100%;
}

#shop,
#inventory,
#leaderboard,
#login {
    background: linear-gradient(135deg, #111827, #1e3a8a);
    padding: 25px;
}

.panel {
    width: min(900px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    background: #ffffff12;
    border: 1px solid #ffffff20;
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
}

.card {
    background: #0005;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
}

.card .icon {
    width: 90px;
    height: 70px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
}

.price {
    color: #facc15;
    font-weight: bold;
}

.equipped {
    background: #16a34a;
    color: white;
}

.back {
    background: #ef4444;
    color: white;
}

input {
    padding: 13px;
    border-radius: 10px;
    border: none;
    width: 260px;
    margin: 5px;
    font-size: 16px;
}

#leaderboardList {
    margin-top: 20px;
}

.player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0005;
    margin: 8px 0;
    padding: 14px;
    border-radius: 12px;
    font-size: 18px;
}

.medal {
    font-size: 27px;
    width: 45px;
}

#gameOver {
    background: #0009;
    z-index: 100;
}

.gameOverBox {
    background: #111827;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    min-width: 300px;
}

.small {
    opacity: .75;
    font-size: 14px;
}

.error {
    color: #f87171;
}

.success {
    color: #4ade80;
}
</style>
</head>

<body>

<div id="app">

    <!-- MENU -->
    <section id="menu" class="screen active">
        <div class="logo">🐦 FLYYYY</div>

        <div id="menuStats" class="stats">
            <span>💰 <b id="menuCoins">0</b></span>
            <span>🏆 Rekord: <b id="menuHighscore">0</b></span>
        </div>

        <button class="mainBtn" onclick="startGame()">START</button>
        <button class="secondaryBtn" onclick="openShop()">🛒 SHOP</button>
        <button class="secondaryBtn" onclick="openInventory()">🎒 INVENTAR</button>
        <button class="secondaryBtn" onclick="openLeaderboard()">🏆 LEADERBOARD</button>
        <button class="secondaryBtn" onclick="openLogin()">👤 ACCOUNT</button>
    </section>


    <!-- GAME -->
    <section id="game" class="screen">

        <canvas id="gameCanvas"></canvas>

        <div class="stats">
            <span>Score: <b id="score">0</b></span>
            <span>💰 <b id="gameCoins">0</b></span>
        </div>

    </section>


    <!-- GAME OVER -->
    <section id="gameOver" class="screen">

        <div class="gameOverBox">

            <h1>GAME OVER</h1>

            <p>Score: <b id="finalScore">0</b></p>
            <p>Rekord: <b id="finalHighscore">0</b></p>

            <button class="mainBtn" onclick="startGame()">
                NOCHMAL
            </button>

            <button class="secondaryBtn" onclick="showScreen('menu')">
                MENÜ
            </button>

        </div>

    </section>


    <!-- SHOP -->
    <section id="shop" class="screen">

        <div class="panel">

            <h1>🛒 SHOP</h1>

            <p>
                Deine Coins:
                <b>💰 <span id="shopCoins">0</span></b>
            </p>

            <div class="grid" id="shopItems"></div>

            <button class="back" onclick="showScreen('menu')">
                ZURÜCK
            </button>

        </div>

    </section>


    <!-- INVENTORY -->
    <section id="inventory" class="screen">

        <div class="panel">

            <h1>🎒 INVENTAR</h1>

            <p>Hier kannst du gekaufte Sachen ausrüsten.</p>

            <div class="grid" id="inventoryItems"></div>

            <button class="back" onclick="showScreen('menu')">
                ZURÜCK
            </button>

        </div>

    </section>


    <!-- LEADERBOARD -->
    <section id="leaderboard" class="screen">

        <div class="panel">

            <h1>🏆 LEADERBOARD</h1>

            <div id="leaderboardList">
                Lade Spieler...
            </div>

            <button class="back" onclick="showScreen('menu')">
                ZURÜCK
            </button>

        </div>

    </section>


    <!-- LOGIN -->
    <section id="login" class="screen">

        <div class="panel" style="text-align:center">

            <h1>👤 ACCOUNT</h1>

            <input id="username" placeholder="Spielername">

            <br>

            <input id="email" type="email" placeholder="E-Mail">

            <br>

            <input id="password" type="password" placeholder="Passwort">

            <br>

            <button class="mainBtn" onclick="registerAccount()">
                REGISTRIEREN
            </button>

            <button class="secondaryBtn" onclick="loginAccount()">
                EINLOGGEN
            </button>

            <p id="loginMessage"></p>

            <button class="back" onclick="showScreen('menu')">
                ZURÜCK
            </button>

        </div>

    </section>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyA0ppKuSgxKKgHEMkX9kUlVhm8pjkVxgXk",
    authDomain: "flyyyy.firebaseapp.com",
    databaseURL: "https://flyyyy-default-rtdb.firebaseio.com",
    projectId: "flyyyy",
    storageBucket: "flyyyy.firebasestorage.app",
    messagingSenderId: "872479897522",
    appId: "1:872479897522:web:3c87b8afdebfc66d01d6ab",
    measurementId: "G-S8YE4S6L8L"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getDatabase(app);


let currentUser = null;

let localData = {
    coins: 0,
    highscore: 0,
    owned: ["default"],
    equipped: "default"
};


// ===============================
// ACCOUNT
// ===============================

onAuthStateChanged(auth, async user => {

    currentUser = user;

    if (user) {

        await loadUserData();

        document.getElementById("loginMessage").textContent =
            "Eingeloggt als " + user.email;

    }

    updateUI();
});


window.registerAccount = async function() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!username || !email || password.length < 6) {

        showLoginMessage(
            "Bitte Name, E-Mail und mindestens 6 Zeichen Passwort eingeben.",
            true
        );

        return;
    }

    try {

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        await set(
            ref(db, "users/" + result.user.uid),
            {
                username: username,
                email: email,
                coins: 0,
                highscore: 0,
                owned: {
                    default: true
                },
                equipped: "default"
            }
        );

        showLoginMessage(
            "Account erfolgreich erstellt!",
            false
        );

    } catch(error) {

        showLoginMessage(
            error.message,
            true
        );

    }
};


window.loginAccount = async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showLoginMessage(
            "Erfolgreich eingeloggt!",
            false
        );

    } catch(error) {

        showLoginMessage(
            "Login fehlgeschlagen.",
            true
        );

    }
};


function showLoginMessage(text, error) {

    const element =
        document.getElementById("loginMessage");

    element.textContent = text;

    element.className =
        error ? "error" : "success";
}


// ===============================
// USER DATA
// ===============================

async function loadUserData() {

    if (!currentUser) return;

    const snapshot =
        await get(
            ref(db, "users/" + currentUser.uid)
        );

    if (!snapshot.exists()) return;

    const data = snapshot.val();

    localData.coins =
        Number(data.coins || 0);

    localData.highscore =
        Number(data.highscore || 0);

    localData.equipped =
        data.equipped || "default";

    if (data.owned) {

        localData.owned =
            Object.keys(data.owned);

    } else {

        localData.owned =
            ["default"];

    }

    updateUI();
}


async function saveUserData() {

    if (!currentUser) {

        localStorage.setItem(
            "flyyyyData",
            JSON.stringify(localData)
        );

        return;
    }

    await update(
        ref(db, "users/" + currentUser.uid),
        {
            coins: localData.coins,
            highscore: localData.highscore,
            equipped: localData.equipped,
            owned: convertOwned()
        }
    );
}


function convertOwned() {

    const result = {};

    localData.owned.forEach(item => {
        result[item] = true;
    });

    return result;
}


// ===============================
// GAME ITEMS
// ===============================

const shopItems = [

    {
        id: "default",
        name: "Classic",
        icon: "🐦",
        price: 0,
        type: "bird"
    },

    {
        id: "blue",
        name: "Blue Bird",
        icon: "🔵",
        price: 50,
        type: "bird"
    },

    {
        id: "red",
        name: "Red Bird",
        icon: "🔴",
        price: 50,
        type: "bird"
    },

    {
        id: "gold",
        name: "Gold Bird",
        icon: "🟡",
        price: 50,
        type: "bird"
    },

    {
        id: "music1",
        name: "Dum Dum",
        icon: "🎵",
        price: 50,
        type: "music"
    },

    {
        id: "music2",
        name: "Night Beat",
        icon: "🎶",
        price: 50,
        type: "music"
    },

    {
        id: "music3",
        name: "Sky Beat",
        icon: "🎼",
        price: 50,
        type: "music"
    }

];


// ===============================
// SHOP
// ===============================

window.openShop = function() {

    renderShop();

    showScreen("shop");

};


function renderShop() {

    const container =
        document.getElementById("shopItems");

    container.innerHTML = "";

    shopItems.forEach(item => {

        const owned =
            localData.owned.includes(item.id);

        const equipped =
            localData.equipped === item.id;

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="icon">${item.icon}</div>

            <h3>${item.name}</h3>

            ${
                owned
                ?
                `<p class="success">Bereits gekauft</p>`
                :
                `<p class="price">💰 ${item.price}</p>`
            }

            ${
                owned
                ?
                `<button
                    class="${equipped ? "equipped" : "secondaryBtn"}"
                    onclick="equipItem('${item.id}')">

                    ${equipped ? "AUSGERÜSTET" : "AUSRÜSTEN"}

                </button>`
                :
                `<button
                    class="mainBtn"
                    onclick="buyItem('${item.id}')">

                    KAUFEN

                </button>`
            }

            ${
                item.type === "music"
                ?
                `<button
                    class="secondaryBtn"
                    onclick="previewMusic('${item.id}')">

                    ▶ ANHÖREN

                </button>`
                :
                ""
            }

        `;

        container.appendChild(card);

    });

    document.getElementById("shopCoins").textContent =
        localData.coins;
}


window.buyItem = async function(id) {

    const item =
        shopItems.find(x => x.id === id);

    if (!item) return;

    if (localData.owned.includes(id)) {

        equipItem(id);

        return;
    }

    if (localData.coins < item.price) {

        alert("Du hast nicht genug Coins!");

        return;
    }

    localData.coins -= item.price;

    localData.owned.push(id);

    await saveUserData();

    renderShop();

    updateUI();

};


window.equipItem = async function(id) {

    if (!localData.owned.includes(id)) {

        alert("Du besitzt diesen Gegenstand nicht.");

        return;
    }

    localData.equipped = id;

    await saveUserData();

    renderShop();

    renderInventory();

};


// ===============================
// INVENTORY
// ===============================

window.openInventory = function() {

    renderInventory();

    showScreen("inventory");

};


function renderInventory() {

    const container =
        document.getElementById("inventoryItems");

    container.innerHTML = "";

    localData.owned.forEach(id => {

        const item =
            shopItems.find(x => x.id === id);

        if (!item) return;

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="icon">${item.icon}</div>

            <h3>${item.name}</h3>

            <button
                class="${
                    localData.equipped === id
                    ? "equipped"
                    : "mainBtn"
                }"
                onclick="equipItem('${id}')">

                ${
                    localData.equipped === id
                    ? "AUSGERÜSTET"
                    : "AUSRÜSTEN"
                }

            </button>

        `;

        container.appendChild(card);

    });

}


// ===============================
// GAME
// ===============================

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

let gameRunning = false;

let bird = {
    x: 120,
    y: 250,
    velocity: 0,
    size: 25
};

let pipes = [];

let score = 0;

let passedPipes = 0;

let gravity = 0.38;

let jumpPower = -7;

let pipeSpeed = 2.2;

let lastTime = 0;


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


window.startGame = function() {

    showScreen("game");

    bird.y =
        canvas.height / 2;

    bird.velocity = 0;

    pipes = [];

    score = 0;

    passedPipes = 0;

    gameRunning = true;

    document.getElementById("score").textContent =
        score;

    lastTime =
        performance.now();

    requestAnimationFrame(gameLoop);

};


function jump() {

    if (!gameRunning) return;

    bird.velocity =
        jumpPower;

}


document.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            e.preventDefault();

            jump();

        }

    }
);


canvas.addEventListener(
    "mousedown",
    jump
);


canvas.addEventListener(
    "touchstart",
    jump
);


function gameLoop(time) {

    if (!gameRunning) return;

    const delta =
        Math.min((time - lastTime) / 16.67, 2);

    lastTime = time;

    updateGame(delta);

    drawGame();

    requestAnimationFrame(gameLoop);

}


function updateGame(delta) {

    bird.velocity +=
        gravity * delta;

    bird.y +=
        bird.velocity * delta;

    if (
        pipes.length === 0 ||
        pipes[pipes.length - 1].x <
        canvas.width - 300
    ) {

        createPipe();

    }

    pipes.forEach(pipe => {

        pipe.x -=
            pipeSpeed * delta;

        if (
            !pipe.passed &&
            pipe.x + pipe.width <
            bird.x
        ) {

            pipe.passed = true;

            score++;

            passedPipes++;

            document.getElementById("score").textContent =
                score;

            /*
             * ALLE 5 ÜBERFLOGENEN HINDERNISSE
             * = 10 COINS
             */

            if (passedPipes % 5 === 0) {

                localData.coins += 10;

                updateUI();

                saveUserData();

            }

        }

    });

    pipes =
        pipes.filter(
            pipe => pipe.x + pipe.width > -50
        );

    checkCollision();

}


function createPipe() {

    const gap = Math.max(
        145,
        190 - score * 1.5
    );

    const minTop = 70;

    const maxTop =
        canvas.height - gap - 100;

    const top =
        minTop +
        Math.random() *
        Math.max(10, maxTop - minTop);

    pipes.push({

        x: canvas.width,

        width: 70,

        top: top,

        bottom:
            top + gap,

        passed: false

    });

}


function checkCollision() {

    if (
        bird.y - bird.size < 0 ||
        bird.y + bird.size > canvas.height * 0.7
    ) {

        endGame();

        return;

    }

    for (const pipe of pipes) {

        const hitX =
            bird.x + bird.size >
            pipe.x &&
            bird.x - bird.size <
            pipe.x + pipe.width;

        const hitY =
            bird.y - bird.size <
            pipe.top ||
            bird.y + bird.size >
            pipe.bottom;

        if (hitX && hitY) {

            endGame();

            return;

        }

    }

}


async function endGame() {

    if (!gameRunning) return;

    gameRunning = false;

    if (score > localData.highscore) {

        localData.highscore =
            score;

        await saveUserData();

    }

    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalHighscore").textContent =
        localData.highscore;

    showScreen("gameOver");

    updateUI();

}


// ===============================
// DRAW GAME
// ===============================

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Himmel

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#38bdf8"
    );

    gradient.addColorStop(
        1,
        "#bae6fd"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Wolken

    ctx.fillStyle =
        "#ffffff88";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const x =
            (i * 230 + Date.now() / 80) %
            (canvas.width + 250) - 150;

        const y =
            80 + i * 60;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            y - 10,
            35,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 65,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // Rohre

    pipes.forEach(pipe => {

        ctx.fillStyle =
            "#16a34a";

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            pipe.bottom,
            pipe.width,
            canvas.height
        );

        ctx.fillStyle =
            "#22c55e";

        ctx.fillRect(
            pipe.x - 5,
            pipe.top - 20,
            pipe.width + 10,
            20
        );

        ctx.fillRect(
            pipe.x - 5,
            pipe.bottom,
            pipe.width + 10,
            20
        );

    });


    // Vogel

    const equipped =
        shopItems.find(
            x => x.id === localData.equipped
        );

    let icon =
        equipped ? equipped.icon : "🐦";

    ctx.font =
        "45px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        icon,
        bird.x,
        bird.y
    );

}


// ===============================
// LEADERBOARD
// ===============================

window.openLeaderboard = function() {

    showScreen("leaderboard");

    loadLeaderboard();

};


async function loadLeaderboard() {

    const container =
        document.getElementById(
            "leaderboardList"
        );

    container.innerHTML =
        "Leaderboard wird geladen...";

    try {

        const snapshot =
            await get(
                ref(db, "users")
            );

        if (!snapshot.exists()) {

            container.innerHTML =
                "Noch keine Spieler vorhanden.";

            return;

        }

        const users =
            [];

        snapshot.forEach(child => {

            const data =
                child.val();

            users.push({

                name:
                    data.username ||
                    "Unbekannt",

                score:
                    Number(
                        data.highscore || 0
                    )

            });

        });

        users.sort(
            (a, b) =>
                b.score - a.score
        );

        container.innerHTML = "";

        users.forEach(
            (player, index) => {

                let medal = "";

                if (index === 0)
                    medal = "🥇";

                else if (index === 1)
                    medal = "🥈";

                else if (index === 2)
                    medal = "🥉";

                else
                    medal = "#" + (index + 1);

                const row =
                    document.createElement("div");

                row.className =
                    "player";

                row.innerHTML = `

                    <span>
                        <span class="medal">
                            ${medal}
                        </span>

                        ${escapeHTML(player.name)}
                    </span>

                    <b>
                        ${player.score}
                    </b>

                `;

                container.appendChild(row);

            }
        );

    } catch(error) {

        container.innerHTML =
            "Leaderboard konnte nicht geladen werden.";

        console.error(error);

    }

}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ===============================
// MUSIC PREVIEW
// ===============================

let audioContext = null;

window.previewMusic = function(id) {

    if (!audioContext) {

        audioContext =
            new AudioContext();

    }

    const melodies = {

        music1:
            [261, 261, 392, 392, 440, 440, 392],

        music2:
            [220, 262, 330, 392, 330, 262, 220],

        music3:
            [330, 392, 440, 523, 440, 392, 330]

    };

    const notes =
        melodies[id];

    if (!notes) return;

    notes.forEach(
        (frequency, index) => {

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.frequency.value =
                frequency;

            oscillator.type =
                "square";

            gain.gain.value =
                0.035;

            oscillator.connect(
                gain
            );

            gain.connect(
                audioContext.destination
            );

            const start =
                audioContext.currentTime +
                index * 0.25;

            oscillator.start(start);

            oscillator.stop(
                start + 0.22
            );

        }
    );

};


// ===============================
// UI
// ===============================

function updateUI() {

    document.getElementById(
        "menuCoins"
    ).textContent =
        localData.coins;

    document.getElementById(
        "gameCoins"
    ).textContent =
        localData.coins;

    document.getElementById(
        "menuHighscore"
    ).textContent =
        localData.highscore;

}


window.showScreen = function(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });

    const screen =
        document.getElementById(id);

    if (screen) {

        screen.classList.add(
            "active"
        );

    }

    updateUI();

};
